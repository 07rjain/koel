[package]
name = "local-whisper-core"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Rust transcription engine for the Local Whisper macOS menu bar app"
repository = "https://github.com/07rjain/koel"

[lib]
name = "local_whisper_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "local-whisper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
fs2 = "0.4"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
transcribe-cpp = "=0.4.1"

[profile.release]
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
